<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الطلاب | سنتر مستر حسين</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth-guard.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="students.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <!-- يتم إدراجه عبر nav.js تلقائياً -->
    </header>

    <main class="wrap page">
      <div class="page-head">
        <div>
          <span class="eyebrow">STUDENT DIRECTORY</span>
          <h1>إدارة الطلاب</h1>
          <p>إضافة الطلاب وإدارة بياناتهم وإنشاء تقارير جاهزة للطباعة.</p>
        </div>
      </div>

      <section class="card">
        <form id="addStudentForm" class="form">
          <h2>إضافة طالب جديد</h2>
          <label>رقم الطالب (تلقائي)<input id="newStudentId" readonly></label>
          <label>اسم الطالب<input id="newStudentName" placeholder="أدخل الاسم بالكامل" required></label>
          <label class="wide-field">المجموعة<select id="newStudentGroup" required></select></label>
          <button class="btn primary">➕ حفظ الطالب</button>
        </form>
      </section>

      <section class="card spaced">
        <div class="section-title">
          <div>
            <h2>سجل الطلاب</h2>
            <p class="hint">ابحث بالاسم أو كود الطالب لإظهار النتائج.</p>
          </div>
          <div class="buttons">
            <button id="exportNewQrBtn" class="btn success" type="button">🖨️ الطلاب الجدد (QR)</button>
            <button id="exportAllStudentsBtn" class="btn primary" type="button">📊 تقرير شامل</button>
          </div>
        </div>
        <input id="searchInput" class="search" placeholder="🔍 اكتب اسم الطالب أو الكود...">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>الكود</th>
                <th>الاسم</th>
                <th>المجموعة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
